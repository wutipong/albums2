name: worker-build-and-test
on:
  push:
    paths:
      - 'worker/**'
  pull_request:
    paths:
      - 'worker/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest  
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Golangci-lint
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        working-directory: ${{ github.workspace }}/worker
        