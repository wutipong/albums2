services:
  app:
    # image: mcr.microsoft.com/devcontainers/base:dev-ubuntu26.04
    env_file: 
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces:cached
      - hf-cache:/home/vscode/.cache/huggingface:cached
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  redis:
    image: redis:8
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    depends_on:
      - redis

  mongo:
    image: mongodb/mongodb-atlas-local
    restart: unless-stopped
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 3
    privileged: true

  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=password
    depends_on:
      - mongo

  s3proxy:
    image: andrewgaul/s3proxy:latest
    environment:
      S3PROXY_ENDPOINT: http://0.0.0.0:9090
      S3PROXY_IDENTITY: ${AWS_ACCESS_KEY_ID}
      S3PROXY_CREDENTIAL: ${AWS_SECRET_ACCESS_KEY}
      JCLOUDS_PROVIDER: filesystem
      JCLOUDS_FILESYSTEM_BASEDIR: /data
    volumes:
      - ./s3proxy:/data

  imgproxy:
    image: darthsim/imgproxy:v3
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_MAX_SRC_RESOLUTION: ${IMGPROXY_MAX_SRC_RESOLUTION}
      IMGPROXY_S3_ENDPOINT_USE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      IMGPROXY_S3_ENDPOINT: ${AWS_ENDPOINT_URL}
      IMGPROXY_S3_REGION: ${AWS_DEFAULT_REGION}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_USE_S3: true

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: dex serve /etc/dex/cfg/config.yaml
    volumes:
      - ./dex-config.yaml:/etc/dex/cfg/config.yaml:ro

volumes:
  redis_data:
  mongo_data:
  hf-cache:
